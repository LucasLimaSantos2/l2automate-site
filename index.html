<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>L2automate</title>
<meta name="description" content="L2automate — aplicativos e automação.">
<style>
  :root { --bg: #ffffff; --fg: #1b1f24; --muted: #5b6470; --line: #e3e6ea; --card: #f6f7f9; }
  @media (prefers-color-scheme: dark) { :root { --bg: #14181d; --fg: #e6e9ed; --muted: #a0a8b3; --line: #2a3038; --card: #1b2026; } }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 48px 16px 64px; }
  h1 { font-size: 2rem; margin: 0 0 4px; }
  .muted { color: var(--muted); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 20px; margin-top: 32px; }
  .card h2 { margin: 0 0 4px; font-size: 1.25rem; }
  a { color: inherit; }
  footer { margin-top: 48px; font-size: .9rem; }
</style>
</head>
<body>
<main>
  <h1>L2automate</h1>
  <p class="muted">Aplicativos e automação.</p>

  <section class="card">
    <h2>AutoTrack</h2>
    <p>Controle de consumo, manutenções, gastos e lucro por km para quem trabalha com o carro.</p>
    <p><a href="/autotrack/privacidade/">Política de privacidade</a></p>
  </section>

  <footer class="muted">Contato: <a href="mailto:autosystech1@gmail.com">autosystech1@gmail.com</a></footer>
</main>
</body>
</html>
